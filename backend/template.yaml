AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Ghost Pet Ops state store, read API (GET /status) and scheduled checker.
  See .kiro/specs/state-store-read-api/design.md section 7 and .kiro/specs/aws-deploy-demo/design.md section 4.

Parameters:
  ThrottleRateLimit:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 1000
    Description: Steady requests per second for the API stage. 20 = 50 viewers polling every 5 s, times 2 (design 6.2).
  ThrottleBurstLimit:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 2000
    Description: Token bucket size for the API stage. 50 = all viewers polling in the same second (design 6.2).
  AllowedOrigin:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https?://[^*\\s/]+$"
    ConstraintDescription: Must be empty or a single origin such as https://d111111abcdef8.cloudfront.net, without wildcards or a path.
    Description: Frontend origin allowed by CORS. Empty (default) means no CORS headers are sent (design 6.3).
  EventRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 365
    Description: Days until an event expires through TTL. Passed to the checker later (design 2.2).
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: CloudWatch Logs retention for the Lambda log groups.
  CheckerMemorySize:
    Type: Number
    Default: 128
    MinValue: 128
    MaxValue: 1024
    Description: >-
      Checker Lambda memory in MB. 128 is the starting value agreed with the checker author.
      The final value is TBD until the first measurements (aws-deploy-demo design 5.4).
  CheckerTimeoutSeconds:
    Type: Number
    MinValue: 10
    MaxValue: 900
    Description: >-
      Checker Lambda timeout in seconds. No default on purpose, so each deploy states it. TBD until agreed with the
      checker author. Initial ceiling approved by the owner is 150, to be lowered after the first day of
      measurements. Recalculate whenever the number of services changes (aws-deploy-demo design 5).
  CheckerScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >-
      State of the 1-minute checker schedule. DISABLED (default) creates the schedule switched off. Invoke the function
      once by hand, check the result, then deploy again with ENABLED. While it is DISABLED, no check runs and every
      service stays unknown (aws-deploy-demo tasks D-6 and D-7).

Conditions:
  HasAllowedOrigin: !Not [!Equals [!Ref AllowedOrigin, ""]]

Resources:
  # One table for service records (pk=SERVICES) and events (pk=EVENTS). Design section 2.
  StateTable:
    Type: AWS::DynamoDB::Table
    # The data is regenerable within minutes (records) or short-lived (events), so the table is not retained.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  StatusApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      FailOnWarnings: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRateLimit
        ThrottlingBurstLimit: !Ref ThrottleBurstLimit
      # The whole block is conditional: SAM turns this into a conditional x-amazon-apigateway-cors.
      # With AllowedOrigin empty (default) there is no CORS configuration at all.
      # Do not put !If on individual fields: SAM then treats the AllowOrigins intrinsic as the
      # entire CORS configuration and drops the other fields.
      CorsConfiguration: !If
        - HasAllowedOrigin
        - AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods:
            - GET
          MaxAge: 600
        - !Ref AWS::NoValue

  StatusFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-status
      RetentionInDays: !Ref LogRetentionDays

  # Reader: Query on this table only, plus its own log group. Design 7, requirement 8.1.
  StatusFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Ghost Pet Ops status Lambda. Read-only Query on the state table.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: query-state-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !GetAtt StateTable.Arn
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt StatusFunctionLogGroup.Arn

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-status
      Description: GET /status for Ghost Pet Ops
      CodeUri: src/
      Handler: status_app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt StatusFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref StatusFunctionLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref StateTable
      Events:
        GetStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref StatusApi
            Path: /status
            Method: GET

  # Writer role and log group for the checker Lambda (design 4.6). Used by CheckerFunction below.
  CheckerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-checker
      RetentionInDays: !Ref LogRetentionDays

  CheckerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Ghost Pet Ops checker Lambda. GetItem, PutItem and UpdateItem on the state table only.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-state-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt StateTable.Arn
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CheckerFunctionLogGroup.Arn

  # Scheduled health checker. Spec: .kiro/specs/aws-deploy-demo/design.md section 4.
  # backend/src/checker_app.py is written by the checker author. Do not deploy before it is merged into main
  # and the pre-deploy checks P-0 to P-12 (tasks.md part C) have passed.
  CheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-checker
      Description: Scheduled health checks for Ghost Pet Ops
      CodeUri: src/
      Handler: checker_app.handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: !Ref CheckerMemorySize
      Timeout: !Ref CheckerTimeoutSeconds
      Role: !GetAtt CheckerFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref CheckerFunctionLogGroup
      # Only the variables confirmed by the checker author. Service URLs come from ghostpet/services.json.
      Environment:
        Variables:
          TABLE_NAME: !Ref StateTable
          EVENT_RETENTION_DAYS: !Ref EventRetentionDays
      # Scheduler calls the function asynchronously. A retry of a one-minute check is stale and only sends
      # extra requests to the monitored sites, so retries are off and old events are dropped (design 4.1).
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 60

  # Lets EventBridge Scheduler invoke the checker function and nothing else (security.md).
  CheckerSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Ghost Pet Ops checker schedule. Invokes the checker Lambda only.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-checker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt CheckerFunction.Arn

  CheckerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${AWS::StackName}-checker
      Description: Runs the checker Lambda every minute
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow:
        Mode: "OFF"
      State: !Ref CheckerScheduleState
      Target:
        Arn: !GetAtt CheckerFunction.Arn
        RoleArn: !GetAtt CheckerSchedulerRole.Arn
        # Empty JSON object, agreed with the checker author.
        Input: "{}"
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 60

Outputs:
  StatusUrl:
    Description: Direct GET /status URL
    Value: !Sub https://${StatusApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/status
  ApiDomain:
    Description: HTTP API domain, used as the CloudFront origin for /status (design 6.3)
    Value: !Sub ${StatusApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  StateTableName:
    Description: State table name, passed to Lambdas as TABLE_NAME
    Value: !Ref StateTable
  CheckerFunctionRoleArn:
    Description: Role used by the checker Lambda (Role property)
    Value: !GetAtt CheckerFunctionRole.Arn
  CheckerFunctionLogGroupName:
    Description: Log group used by the checker Lambda (LoggingConfig.LogGroup)
    Value: !Ref CheckerFunctionLogGroup
  CheckerFunctionName:
    Description: Checker function name, for the one manual test invocation before the schedule is enabled
    Value: !Ref CheckerFunction
  CheckerScheduleName:
    Description: Name of the 1-minute checker schedule (State is set by CheckerScheduleState)
    Value: !Ref CheckerSchedule
  EventRetentionDays:
    Description: Event TTL in days, for the checker's EVENT_RETENTION_DAYS setting
    Value: !Ref EventRetentionDays
