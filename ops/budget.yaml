AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ghost Pet Ops monthly cost budget with email alerts. It covers the whole AWS account, not one stack, and its cost
  data arrives with a delay of several hours. See .kiro/specs/aws-deploy-demo/design.md section 9.1.

Parameters:
  BudgetLimitUsd:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Monthly cost limit in USD.
  NotificationEmail:
    Type: String
    NoEcho: true
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be an email address.
    Description: >-
      Address that receives the alerts. No default on purpose. Pass it when deploying and never write it in a file
      that is committed.

Resources:
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

Outputs:
  BudgetName:
    Description: Name of the monthly cost budget
    Value: !Ref MonthlyCostBudget
