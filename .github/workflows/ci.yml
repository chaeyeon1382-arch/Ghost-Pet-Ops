name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The dev-only helpers (DEV_FAKE_STATUS, DEV_API_TARGET) must never reach a production bundle.
      # Each variant builds with a different setting, then dist/ is searched for the dev-only strings.
      # No secrets are used. The markers are placeholders. `if grep` is used because `! grep` does not fail under `bash -e`.
      - name: Production bundle contains no dev tooling
        run: |
          if grep -rn "DEV_" src/; then
            echo "src/ must not mention DEV_ variables"
            exit 1
          fi
          for variant in "NONE=1" "VITE_DATA_SOURCE=api" "DEV_FAKE_STATUS=healthy" "DEV_API_TARGET=http://dev-proxy-target.invalid:9"; do
            echo "::group::build with $variant"
            rm -rf dist
            env "$variant" npm run build
            echo "::endgroup::"
            if grep -rEn "DEV_FAKE_STATUS|DEV_API_TARGET|fake-status|dev-proxy-target" dist/; then
              echo "dev tooling leaked into dist/ (variant: $variant)"
              exit 1
            fi
            if grep -rEn "execute-api|amazonaws" dist/; then
              echo "an API host leaked into dist/ (variant: $variant)"
              exit 1
            fi
          done

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      SAM_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          version: 1.172.1

      # Validation runs offline. The region is only needed for the SAM transform. No credentials are used.
      - name: Validate SAM template
        run: sam validate --lint --template template.yaml --region us-east-1

      # Same offline validation for the frontend hosting and demo target templates (aws-deploy-demo spec).
      - name: Validate frontend template
        run: sam validate --lint --template ../frontend/template.yaml --region us-east-1

      - name: Validate demo template
        run: sam validate --lint --template ../demo/template.yaml --region us-east-1

      - name: Validate budget template
        run: sam validate --lint --template ../ops/budget.yaml --region us-east-1
