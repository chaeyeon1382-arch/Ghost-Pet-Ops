AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ghost Pet Ops frontend hosting: private S3 bucket behind CloudFront, with /status forwarded to the HTTP API
  of the backend stack on the same domain (no CORS). See .kiro/specs/aws-deploy-demo/design.md section 6.

Parameters:
  ApiDomain:
    Type: String
    AllowedPattern: "^[a-z0-9]+\\.execute-api\\.[a-z0-9-]+\\.amazonaws\\.com$"
    ConstraintDescription: Must be the HTTP API domain only, for example abc123.execute-api.us-east-1.amazonaws.com. No scheme, no path.
    Description: ApiDomain output of the backend stack. Passed as a parameter, never through a stack export.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: CloudFront price class. PriceClass_100 uses the cheapest set of edge locations, which is enough for a demo.

Resources:
  # Private bucket. Only the distribution below can read it (requirement 5.1, 5.2).
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        Description: Lets CloudFront read the private frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

  # /status cache: 5 s by default, never more than 10 s. Nothing but the path is in the cache key, so a viewer
  # cannot bypass the cache with a query string and send extra load to the API (design 6, requirement 6.3).
  StatusCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-status-cache
        Comment: Short cache for GET /status
        MinTTL: 0
        DefaultTTL: 5
        MaxTTL: 10
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Ghost Pet Ops frontend and /status
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        # Default CloudFront certificate and domain. No custom domain (requirement 5.3).
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3-frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api-status
            DomainName: !Ref ApiDomain
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              # The status Lambda times out after 5 s and the cache never holds more than 10 s.
              OriginReadTimeout: 10
        # Static files. Managed policy ids: CachingOptimized, SecurityHeadersPolicy. Checked in tasks B-9.
        DefaultCacheBehavior:
          TargetOriginId: s3-frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          # The exact path /status. Query strings do not change which behavior matches.
          # OriginRequestPolicy is AllViewerExceptHostHeader (managed), because API Gateway needs its own Host header.
          - PathPattern: /status
            TargetOriginId: api-status
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref StatusCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # Only the error caching time is set. There is no ResponseCode and no ResponsePagePath, so the original
        # status and body pass through. A rule that replaced errors with index.html would also rewrite /status
        # errors, because custom error responses apply to the whole distribution (requirement 5.5, 6.7).
        CustomErrorResponses:
          - ErrorCode: 500
            ErrorCachingMinTTL: 1
          - ErrorCode: 502
            ErrorCachingMinTTL: 1
          - ErrorCode: 503
            ErrorCachingMinTTL: 1
          - ErrorCode: 504
            ErrorCachingMinTTL: 1

Outputs:
  DistributionDomainName:
    Description: CloudFront domain of the site. A deployment value, do not commit it.
    Value: !GetAtt FrontendDistribution.DomainName
  DistributionId:
    Description: Distribution id, used for the cache invalidation. A deployment value, do not commit it.
    Value: !Ref FrontendDistribution
  BucketName:
    Description: Bucket for the built files (aws s3 sync dist/). A deployment value, do not commit it.
    Value: !Ref FrontendBucket
